<!doctype html>
<!--
  The Akshar Blocks icon: a big red "A" block and a small yellow "अ" block (English + Hindi).
  One drawing, rendered at 512 px in several forms (see ?mode=):
    foreground  – adaptive-icon foreground (transparent, art inside the 66dp safe zone)
    monochrome  – Android 13 themed icon: white blocks with the letters cut out
    legacy      – rounded-square icon for Android 7.x
    round       – round icon for Android 7.x
    play        – 512 px Google Play icon (square, art filling the safe zone)
-->
<html><head><meta charset="utf-8"><title>Icon</title>
<style>
  html,body{margin:0;width:512px;height:512px;overflow:hidden;background:transparent}
  svg{display:block;width:512px;height:512px}
</style></head>
<body>
<svg id="svg" viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="square"><rect x="4" y="4" width="100" height="100" rx="22"/></clipPath>
    <clipPath id="circle"><circle cx="54" cy="54" r="50"/></clipPath>
    <!-- For the themed icon: blocks white, letters cut out. -->
    <mask id="cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
      <rect x="0" y="0" width="108" height="108" fill="#fff"/>
      <g transform="rotate(-6 45 47)">
        <path fill="#000" fill-rule="evenodd" d="M42.5,36L47.5,36L56,58L51,58L49.3,53L40.7,53L39,58L34,58Z M45,40.5L47.9,49L42.1,49Z"/>
      </g>
      <g transform="rotate(8 66 66)">
        <text x="66" y="67" text-anchor="middle" dominant-baseline="central" fill="#000"
              font-family="Nirmala UI, Mangal, sans-serif" font-weight="700" font-size="15">अ</text>
      </g>
    </mask>
  </defs>
  <g id="frame">
    <rect id="bg" x="0" y="0" width="108" height="108" fill="#CFE8FF"/>
    <g id="art">
      <g transform="rotate(-6 45 47)">
        <path class="edge" fill="#B8413A" d="M36,34h18a8,8 0,0 1,8 8v18a8,8 0,0 1,-8 8h-18a8,8 0,0 1,-8 -8v-18a8,8 0,0 1,8 -8z"/>
        <path class="face" fill="#FF5A4E" d="M36,30h18a8,8 0,0 1,8 8v18a8,8 0,0 1,-8 8h-18a8,8 0,0 1,-8 -8v-18a8,8 0,0 1,8 -8z"/>
        <path class="letter" fill="#FFFFFF" fill-rule="evenodd" d="M42.5,36L47.5,36L56,58L51,58L49.3,53L40.7,53L39,58L34,58Z M45,40.5L47.9,49L42.1,49Z"/>
      </g>
      <g transform="rotate(8 66 66)">
        <path class="edge" fill="#B78D2C" d="M61,59h10a5,5 0,0 1,5 5v10a5,5 0,0 1,-5 5h-10a5,5 0,0 1,-5 -5v-10a5,5 0,0 1,5 -5z"/>
        <path class="face" fill="#FFC53D" d="M61,56h10a5,5 0,0 1,5 5v10a5,5 0,0 1,-5 5h-10a5,5 0,0 1,-5 -5v-10a5,5 0,0 1,5 -5z"/>
        <text class="letter" x="66" y="67" text-anchor="middle" dominant-baseline="central" fill="#1D2B53"
              font-family="Nirmala UI, Mangal, sans-serif" font-weight="700" font-size="15">अ</text>
      </g>
    </g>
  </g>
</svg>
<script>
  const mode = new URLSearchParams(location.search).get('mode') || 'play';
  const svg = document.getElementById('svg');
  const bg = document.getElementById('bg');
  const frame = document.getElementById('frame');
  const art = document.getElementById('art');
  if (mode === 'foreground') {
    bg.remove();
  } else if (mode === 'monochrome') {
    bg.remove();
    document.querySelectorAll('.letter').forEach(e => e.remove());
    document.querySelectorAll('.edge').forEach(e => e.remove());
    document.querySelectorAll('.face').forEach(e => e.setAttribute('fill', '#fff'));
    art.setAttribute('mask', 'url(#cutout)');
  } else if (mode === 'play') {
    svg.setAttribute('viewBox', '21 21 66 66');            // art fills the Play icon
  } else {                                                 // legacy / round: art enlarged inside the shape
    art.setAttribute('transform', 'translate(54 54) scale(1.45) translate(-54 -54)');
    frame.setAttribute('clip-path', mode === 'round' ? 'url(#circle)' : 'url(#square)');
  }
</script>
</body></html>
