<!doctype html>
<html><head><meta charset="utf-8"><title>Feature graphic</title>
<style>
  :root { --ink:#1D2B53; --sky:#CFE8FF; }
  html,body { margin:0; width:1024px; height:500px; overflow:hidden; background:var(--sky);
    font-family:"Segoe UI Black","Segoe UI","Nirmala UI",Arial,sans-serif; font-weight:900; color:var(--ink); }
  .stage { position:relative; width:1024px; height:500px; }
  .block { position:absolute; width:150px; height:150px; border-radius:36px;
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:104px; line-height:1; }
  .copy { position:absolute; left:560px; top:0; bottom:0; width:430px;
    display:flex; flex-direction:column; justify-content:center; }
  h1 { margin:0; font-size:76px; line-height:1.0; letter-spacing:-1px; }
  p { margin:22px 0 0; font-family:"Segoe UI",Arial,sans-serif; font-weight:700; font-size:30px; line-height:1.3; }
</style></head>
<body><div class="stage">
  <!-- A, अ, क, 1 toy blocks (English, Hindi vowels, consonants, numbers), stacked like a child built them. -->
  <div class="block" style="left:70px; top:250px; background:#FF5A4E; box-shadow:0 12px 0 #B8413A; transform:rotate(-6deg)">A</div>
  <div class="block" style="left:236px; top:262px; background:#2F7BFF; box-shadow:0 12px 0 #2258B8; transform:rotate(4deg); font-family:'Nirmala UI',sans-serif; font-weight:700">अ</div>
  <div class="block" style="left:152px; top:84px; background:#22B866; box-shadow:0 12px 0 #18844A; transform:rotate(-3deg); font-family:'Nirmala UI',sans-serif; font-weight:700">क</div>
  <div class="block" style="left:392px; top:250px; background:#9B5CFF; box-shadow:0 12px 0 #7042B8; transform:rotate(7deg)">1</div>
  <div class="copy">
    <h1>Akshar<br>Blocks</h1>
    <p>English and Hindi letters, बारहखड़ी and numbers, learned by playing.</p>
  </div>
</div></body></html>
