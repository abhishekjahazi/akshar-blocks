<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akshar Blocks — New Look</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --page: #E4E9F5; --page-text: #1B2240;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page: #070A1C; --page-text: #E8ECFF; }
}
:root[data-theme="dark"] { --page: #070A1C; --page-text: #E8ECFF; }

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--page); color: var(--page-text);
  font-family: 'Baloo 2', system-ui, sans-serif;
}
header.page { max-width: 1760px; margin: 0 auto; padding: 28px 16px 8px; }
header.page h1 { margin: 0; font-size: clamp(28px, 4vw, 44px); line-height: 1.1; }
header.page p { margin: 4px 0 0; font-size: 17px; opacity: .8; }
.row { max-width: 1760px; margin: 0 auto; padding: 20px 16px 48px; display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; }
figure { margin: 0; display: flex; flex-direction: column; gap: 10px; align-items: center; }
figcaption { font-weight: 700; font-size: 16px; opacity: .8; }

/* ---------- One phone ---------- */
.phone {
  /* Light theme tokens */
  --bg: #EEF3FF; --text: #1B2240; --sub: #4E5880;
  --glass: rgba(255,255,255,.58); --glass-strong: rgba(255,255,255,.85);
  --border: rgba(255,255,255,.9); --track: rgba(27,34,64,.1);
  --shadow: 0 10px 26px rgba(40,60,140,.12);
  --b1: rgba(124,196,255,.85); --b2: rgba(255,179,138,.8); --b3: rgba(166,240,198,.85); --b4: rgba(201,167,255,.8);
  --hero: linear-gradient(120deg, #2F6BFF, #8B5CF6); --hero-border: rgba(255,255,255,.6);

  width: 390px; max-width: calc(100vw - 32px); height: 844px; position: relative; overflow: hidden;
  border-radius: 40px; background: var(--bg); color: var(--text);
  box-shadow: 0 30px 60px rgba(10,20,60,.25), 0 0 0 10px #10142B;
  transition: background .5s ease, color .5s ease;
}
.phone.dark {
  --bg: #0D1230; --text: #F4F6FF; --sub: #AEB7DD;
  --glass: rgba(255,255,255,.08); --glass-strong: rgba(255,255,255,.14);
  --border: rgba(255,255,255,.16); --track: rgba(255,255,255,.14);
  --shadow: 0 10px 28px rgba(0,0,0,.35);
  --b1: rgba(59,91,255,.55); --b2: rgba(255,94,150,.42); --b3: rgba(20,200,160,.38); --b4: rgba(139,92,246,.5);
  --hero: linear-gradient(120deg, rgba(47,107,255,.85), rgba(139,92,246,.85)); --hero-border: rgba(255,255,255,.22);
}

.blob { position: absolute; border-radius: 50%; filter: blur(38px); animation: float 9s ease-in-out infinite; transition: background .6s ease; }
@keyframes float { 0%,100% { transform: translate(0,0) scale(1) } 50% { transform: translate(18px,-22px) scale(1.08) } }
@keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.92) } to { opacity: 1; transform: none } }
@keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
@keyframes glow { 0%,100% { box-shadow: 0 0 0 0 rgba(255,184,0,.55) } 50% { box-shadow: 0 0 0 12px rgba(255,184,0,0) } }
@keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.12) } }
@keyframes drop { 0% { opacity: 0; transform: translateY(-26px) rotate(-12deg) } 70% { transform: translateY(3px) rotate(4deg) } 100% { opacity: 1; transform: none } }
@keyframes shake { 0%,100% { transform: translateX(0) } 20%,60% { transform: translateX(-9px) } 40%,80% { transform: translateX(9px) } }
@keyframes win { 0% { transform: scale(1) } 40% { transform: scale(1.15) } 100% { transform: scale(1.08) } }
@keyframes confetti { from { transform: translate(0,0) rotate(0); opacity: 1 } to { transform: translate(var(--dx), var(--dy)) rotate(540deg); opacity: 0 } }

.content { position: relative; height: 100%; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.glass {
  border: 1px solid var(--border); background: var(--glass);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  transition: background .5s ease, border-color .5s ease;
}
button { font-family: inherit; color: inherit; cursor: pointer; }
.icon-btn { width: 44px; height: 44px; border-radius: 16px; display: flex; align-items: center; justify-content: center; padding: 0; }
.top { display: flex; align-items: center; gap: 8px; }
.chip { height: 44px; border-radius: 22px; display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; }
.child { flex-grow: 1; padding: 0 12px 0 5px; font-size: 17px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #FFB547, #FF7A2F); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 17px; }
.stars { padding: 0 14px 0 10px; gap: 6px; }
.pop { animation: pop .5s cubic-bezier(.2,.9,.3,1.3) both; }
.hello b { display: block; font-size: 26px; line-height: 1.1; }
.hello span { font-size: 15px; font-weight: 600; color: var(--sub); }
.hero {
  position: relative; border: 1px solid var(--hero-border); border-radius: 28px; padding: 14px 14px 14px 18px;
  background: var(--hero); box-shadow: var(--shadow); display: flex; align-items: center; gap: 14px; text-align: left; color: #fff;
}
.hero .t { font-size: 22px; font-weight: 800; line-height: 1; }
.hero .s { font-size: 14px; font-weight: 600; opacity: .92; margin: 6px 0; }
.dots { display: flex; gap: 6px; }
.dots i { height: 8px; width: 38px; border-radius: 4px; background: rgba(255,255,255,.4); }
.dots i.on { background: #fff; }
.play { width: 62px; height: 62px; flex-shrink: 0; border-radius: 50%; background: #FFC21A; display: flex; align-items: center; justify-content: center; animation: bob 2.2s ease-in-out infinite, glow 2.2s ease-out infinite; }
.group-title { display: flex; align-items: baseline; gap: 8px; padding: 0 4px; margin-bottom: 7px; }
.group-title b { font-size: 17px; }
.group-title span { font-size: 14px; font-weight: 600; color: var(--sub); }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
.card {
  border-radius: 22px; box-shadow: var(--shadow); padding: 9px 8px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  transition: transform .2s ease, background .5s ease;
}
.card:hover { transform: translateY(-3px) scale(1.02); }
.card:active { transform: scale(.95); }
.tile { width: 52px; height: 40px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 17px; letter-spacing: 1px; box-shadow: 0 4px 10px rgba(0,0,0,.15); }
.card .l { font-size: 14px; font-weight: 800; line-height: 1.15; white-space: nowrap; }
.card .s { font-size: 11.5px; font-weight: 600; line-height: 1; color: var(--sub); white-space: nowrap; }
.bar { width: 70%; height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; margin-top: 3px; }
.bar i { display: block; height: 100%; border-radius: 3px; }

/* Game */
.title { flex-grow: 1; display: flex; flex-direction: column; line-height: 1.05; }
.title b { font-size: 21px; }
.title span { font-size: 14px; font-weight: 600; color: var(--sub); }
.steps { display: flex; gap: 6px; padding: 0 4px; }
.steps i { flex-grow: 1; height: 7px; border-radius: 4px; background: var(--track); }
.question {
  flex-grow: 1; border-radius: 32px; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 22px; padding: 22px 18px; position: relative; backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
}
.hear { position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; border-radius: 50%; background: var(--glass-strong); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; }
.ask { font-size: 17px; font-weight: 700; color: var(--sub); text-align: center; line-height: 1.2; }
.sum { display: flex; align-items: center; gap: 12px; }
.apples { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.apple { animation: drop .6s cubic-bezier(.2,.9,.3,1.2) both; }
.plus { font-size: 44px; font-weight: 800; }
.eq { font-size: 58px; font-weight: 800; line-height: 1; letter-spacing: 2px; }
.q { display: inline-block; color: #FFB020; animation: pulse 1.4s ease-in-out infinite; }
.answers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.answer {
  height: 96px; border-radius: 28px; border: 1px solid rgba(255,255,255,.55); color: #fff; font-size: 50px; font-weight: 800;
  box-shadow: 0 10px 22px var(--glow), inset 0 2px 0 rgba(255,255,255,.45); transition: transform .18s ease, opacity .3s ease;
}
.answer:hover { transform: translateY(-4px); }
.answer.wrong { animation: shake .45s ease; }
.answer.right { animation: win .5s ease forwards; }
.answer.dim { opacity: .35; transform: scale(.88); }
.bit { position: absolute; width: 10px; height: 10px; border-radius: 2px; pointer-events: none; animation: confetti 1.1s ease-out forwards; }
.toast { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 8px 16px; border-radius: 20px; background: #22B866; color: #fff; font-weight: 800; font-size: 17px; white-space: nowrap; animation: pop .4s ease both; }

@media (prefers-reduced-motion: reduce) {
  .blob, .pop, .play, .q, .apple, .answer, .bit { animation: none !important; }
}
</style>
</head>
<body>
<header class="page">
  <h1>Akshar Blocks · New look</h1>
  <p>Colourful glass, light and dark. Tap ☀️ / 🌙 on any screen to switch, and try the answers in the maths game.</p>
</header>
<div class="row">
  <figure><div class="phone" data-screen="home"></div><figcaption>Home · Light</figcaption></figure>
  <figure><div class="phone dark" data-screen="home"></div><figcaption>Home · Dark</figcaption></figure>
  <figure><div class="phone" data-screen="game"></div><figcaption>Maths game · Light</figcaption></figure>
  <figure><div class="phone dark" data-screen="game"></div><figcaption>Maths game · Dark</figcaption></figure>
</div>

<template id="home">
  <div class="blob" style="width:260px;height:260px;left:-70px;top:-60px;background:var(--b1)"></div>
  <div class="blob" style="width:240px;height:240px;right:-80px;top:200px;background:var(--b2);animation-delay:-3s"></div>
  <div class="blob" style="width:280px;height:280px;left:-60px;bottom:120px;background:var(--b3);animation-delay:-6s"></div>
  <div class="blob" style="width:220px;height:220px;right:-40px;bottom:-60px;background:var(--b4);animation-delay:-2s"></div>
  <div class="content">
    <div class="top">
      <button class="glass icon-btn" aria-label="Grown-ups">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      </button>
      <button class="glass chip child"><span class="avatar">R</span>Riya</button>
      <button class="glass chip stars"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z" fill="#FFC21A" stroke="#E59A00" stroke-width="1.2" stroke-linejoin="round"/></svg>32</button>
      <button class="glass icon-btn theme" aria-label="Switch light or dark"></button>
    </div>
    <div class="hello pop"><b>Hi Riya!</b><span>What shall we learn today? · आज क्या सीखें?</span></div>
    <button class="hero pop" style="animation-delay:.08s">
      <div style="flex-grow:1">
        <div class="t">Today's games</div>
        <div class="s">आज के खेल · 1 of 4 done</div>
        <div class="dots"><i class="on"></i><i></i><i></i><i></i></div>
      </div>
      <span class="play"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="#1B2240" stroke="#1B2240" stroke-width="1.5" stroke-linejoin="round"/></svg></span>
    </button>
    <div class="groups"></div>
  </div>
</template>

<template id="game">
  <div class="blob" style="width:260px;height:260px;left:-80px;top:-40px;background:var(--b1)"></div>
  <div class="blob" style="width:240px;height:240px;right:-90px;top:300px;background:var(--b2);animation-delay:-4s"></div>
  <div class="blob" style="width:260px;height:260px;left:-40px;bottom:-70px;background:var(--b3);animation-delay:-7s"></div>
  <div class="content" style="gap:16px;padding-bottom:24px">
    <div class="top" style="gap:10px">
      <button class="glass icon-btn" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="title"><b>Add</b><span>जोड़ो · question 3 of 5</span></div>
      <button class="glass icon-btn theme" aria-label="Switch light or dark"></button>
      <div class="glass chip stars"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z" fill="#FFC21A" stroke="#E59A00" stroke-width="1.2" stroke-linejoin="round"/></svg><span class="count">32</span></div>
    </div>
    <div class="steps"><i style="background:#22B866"></i><i style="background:#22B866"></i><i style="background:#FFC21A"></i><i></i><i></i></div>
    <div class="question glass pop">
      <button class="hear" aria-label="Hear the question again"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h4l5 4v-13l-5 4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
      <div class="ask">How many apples in all?<br>कुल कितने सेब?</div>
      <div class="sum"><div class="apples left"></div><span class="plus">+</span><div class="apples right"></div></div>
      <div class="eq">2 + 3 = <span class="q">?</span></div>
    </div>
    <div class="answers"></div>
  </div>
</template>

<script>
const SUN = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
const MOON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
const APPLE = '<svg class="apple" width="54" height="58" viewBox="0 0 54 58"><path d="M27 15c-6-5-20-4-21 11-1 13 9 28 15 28 3 0 4-2 6-2s3 2 6 2c6 0 16-15 15-28C47 11 33 10 27 15z" fill="#F23B3B"/><path d="M14 24c1-5 4-7 8-7" stroke="#FF9C9C" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M27 15c0-5 1-9 4-12" stroke="#7A4A1E" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M30 9c4-5 11-5 14-3-3 5-9 6-14 3z" fill="#3CB44B"/></svg>';

const GROUPS = [
  ['Letters', 'अक्षर', [
    ['English', 'A B C D', 'ABC', '#4D8BFF', '#2F6BFF', 70],
    ['Small', 'a b c d', 'abc', '#2BD1BF', '#0FA898', 45],
    ['स्वर', 'Vowels', 'अआइ', '#FF7B6E', '#F0473B', 30],
    ['व्यंजन', 'Consonants', 'कखग', '#3ACF7C', '#1AA65A', 20],
    ['बारहखड़ी', 'Syllables', 'काकि', '#B07CFF', '#8B4DF2', 10],
    ['मराठी', 'Marathi', 'अआइ', '#8A73FF', '#5B3FE0', 0],
  ]],
  ['Numbers & Maths', 'गिनती और गणित', [
    ['Numbers', '1 to 100', '123', '#FFA347', '#F57F12', 55],
    ['गिनती', 'Hindi numbers', '१२३', '#FF6FB5', '#EC3F92', 15],
    ['Maths', 'गणित', '1+2', '#FFB020', '#E58A00', 25],
  ]],
  ['Explore', 'खोजो', [
    ['World', 'दुनिया', '●▲■', '#22B4C9', '#0C8599', 40],
    ['Rhymes', 'कविताएँ', '♪♫', '#FF8A4C', '#E0581B', 60],
    ['My name', 'मेरा नाम', 'Riya', '#5C7CFA', '#364FC7', 80],
  ]],
];
const ANSWERS = [['4', '#5B95FF', '#2F6BFF', 'rgba(47,107,255,.35)'], ['5', '#45D98A', '#1AA65A', 'rgba(26,166,90,.35)'], ['6', '#B58AFF', '#8B4DF2', 'rgba(139,77,242,.35)']];

function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

function buildHome(phone) {
  const box = phone.querySelector('.groups');
  let i = 0;
  for (const [title, hindi, items] of GROUPS) {
    const g = el('div');
    g.append(el('div', 'group-title', `<b>${title}</b><span>${hindi}</span>`));
    const grid = el('div', 'grid');
    for (const [label, sub, sample, from, to, pct] of items) {
      const card = el('button', 'card glass pop');
      card.style.animationDelay = (0.14 + (i++) * 0.04).toFixed(2) + 's';
      card.innerHTML = `<span class="tile" style="background:linear-gradient(135deg,${from},${to})">${sample}</span>
        <span class="l">${label}</span><span class="s">${sub}</span>
        <span class="bar"><i style="width:${pct}%;background:${to}"></i></span>`;
      grid.append(card);
    }
    g.append(grid);
    box.append(g);
  }
  box.style.cssText = 'display:flex;flex-direction:column;gap:12px';
}

function buildGame(phone) {
  const left = phone.querySelector('.apples.left'), right = phone.querySelector('.apples.right');
  for (let n = 0; n < 5; n++) {
    const holder = el('div', null, APPLE);
    holder.firstChild.style.animationDelay = (0.25 + n * 0.12).toFixed(2) + 's';
    (n < 2 ? left : right).append(holder.firstChild);
  }
  const answers = phone.querySelector('.answers');
  const q = phone.querySelector('.q');
  const count = phone.querySelector('.count');
  ANSWERS.forEach(([value, from, to, glow], k) => {
    const b = el('button', 'answer pop', value);
    b.style.background = `linear-gradient(160deg, ${from}, ${to})`;
    b.style.setProperty('--glow', glow);
    b.style.animationDelay = (0.5 + k * 0.08) + 's';
    b.addEventListener('click', () => {
      if (phone.dataset.solved) return;
      if (value !== '5') {
        b.classList.remove('wrong', 'pop'); void b.offsetWidth; b.classList.add('wrong');
        return;
      }
      phone.dataset.solved = '1';
      b.classList.remove('pop'); b.classList.add('right');
      answers.querySelectorAll('.answer').forEach(o => { if (o !== b) o.classList.add('dim'); });
      q.textContent = '5'; q.style.animation = 'none'; q.style.color = '#22B866';
      count.textContent = '33';
      confetti(phone, b);
      const toast = el('div', 'toast', 'Well done! · शाबाश!');
      phone.append(toast);
      setTimeout(() => reset(phone), 2600);
    });
    answers.append(b);
  });
}

function confetti(phone, from) {
  const p = phone.getBoundingClientRect(), r = from.getBoundingClientRect();
  const colors = ['#FF5A4E', '#FFC53D', '#22B866', '#2F7BFF', '#9B5CFF', '#FF4FA3'];
  for (let n = 0; n < 34; n++) {
    const bit = el('i', 'bit');
    const a = Math.random() * Math.PI * 2, d = 80 + Math.random() * 140;
    bit.style.left = (r.left - p.left + r.width / 2) + 'px';
    bit.style.top = (r.top - p.top + r.height / 2) + 'px';
    bit.style.background = colors[n % colors.length];
    bit.style.setProperty('--dx', Math.cos(a) * d + 'px');
    bit.style.setProperty('--dy', Math.sin(a) * d - 120 + 'px');
    phone.append(bit);
    setTimeout(() => bit.remove(), 1200);
  }
}

function reset(phone) {
  phone.innerHTML = '';
  delete phone.dataset.solved;
  render(phone);
}

function render(phone) {
  const screen = phone.dataset.screen;
  phone.append(document.getElementById(screen).content.cloneNode(true));
  if (screen === 'home') buildHome(phone); else buildGame(phone);
  const toggle = phone.querySelector('.theme');
  const paint = () => { toggle.innerHTML = phone.classList.contains('dark') ? SUN : MOON; };
  paint();
  toggle.addEventListener('click', () => { phone.classList.toggle('dark'); paint(); });
}

document.querySelectorAll('.phone').forEach(render);
</script>
</body>
</html>
