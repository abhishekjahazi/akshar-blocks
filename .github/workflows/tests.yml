name: Tests

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Gradle's daemon runs on JDK 25 (gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Debug build
        run: ./gradlew assembleDebug

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  # Builds the release version (R8 and all) and plays it on an emulator, so a crash that only
  # release builds have can't be shipped again (1.1 and 1.2 crashed at start).
  release-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      # Signed with the debug key so the emulator can install it (CI has no release key).
      - name: Release build
        run: ./gradlew assembleRelease -PciDebugSigning

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the app and play it on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/release-smoke-test.sh
